name: Build and test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite and cppcheck
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev cppcheck
      - name: Static analysis (cppcheck reports problems, it does not fail the build)
        run: cppcheck --enable=warning,style,performance,portability --std=c99 --inline-suppr -Iinclude src/
      - name: Build (warnings are shown, -Wall)
        run: make
      - name: Unit tests (8 test cases for the scoring module)
        run: make test
      - name: System tests (TC-01 to TC-22)
        run: bash tests/run_system_tests.sh
